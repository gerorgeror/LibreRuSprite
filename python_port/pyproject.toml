[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libresprite-python-port"
version = "0.1.0"
description = "Initial Python rewrite components for LibreSprite"
requires-python = ">=3.10"

[project.scripts]
libresprite-py = "libresprite_py.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
